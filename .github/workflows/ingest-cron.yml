name: RealityPulse Ingestion Cron

on:
  schedule:
    # Runs at 9am, 12pm, 3pm, 6pm, 9pm IST (3:30, 6:30, 9:30, 12:30, 15:30 UTC)
    - cron: '30 3,6,9,12,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ingest:
    name: Run Ingest & Gemini Scoring Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ingest Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://realitypulse-3elwet6vg-thinkable-co.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering automated reality TV ingestion pipeline..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${APP_URL}/api/cron/ingest" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Status: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Ingest failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Ingestion completed successfully."
